# Dependencies and image layers are written only in GitHub CI. Private publishing only.
name: Publish private RustDesk S6 image
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Fixed version; never latest
        required: true
        default: v2026.10.14.1
      server_ref:
        description: Full server fork commit SHA
        required: true
        default: 3a80f1f1ccebc93122c454dc7f52df7b4d1407c3
      frontend_ref:
        description: Full frontend fork commit SHA
        required: true
        default: 3998c2a9213fcd047252776d0f0db33e6717026c
  push:
    tags:
    - s6-v*
permissions:
  contents: read
  packages: write
concurrency:
  group: private-rustdesk-s6-publish
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  SERVER_REF: ${{ inputs.server_ref || '3a80f1f1ccebc93122c454dc7f52df7b4d1407c3' }}
  FRONTEND_REF: ${{ inputs.frontend_ref || '3998c2a9213fcd047252776d0f0db33e6717026c' }}
  API_RUNTIME_IMAGE: alpine@sha256:d56c381f961d307a21b3ca004cf1e3910f106644aefb1f43e654c8a56c4fd395
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Validate fixed sources and version
      env: {}
      run: |-
        set -euo pipefail
        python3 -B - <<'PY'
        import os,re
        v=os.environ["RELEASE_VERSION"].removeprefix("s6-")
        assert re.fullmatch(r"v[0-9]+(\.[0-9]+){2,3}(-[A-Za-z0-9][A-Za-z0-9._-]*)?",v)
        assert all(re.fullmatch(r"[a-f0-9]{40}",os.environ[n]) for n in ("SERVER_REF","FRONTEND_REF"))
        with open(os.environ["GITHUB_ENV"],"a") as f:
         f.write("RELEASE_VERSION="+v+"\n")
         f.write("APP_VERSION="+v.removeprefix("v")+"\n")
         f.write("REGISTRY_IMAGE=ghcr.io/"+os.environ["GITHUB_REPOSITORY_OWNER"].lower()+"/rustdesk-server-s6\n")
        PY
    - name: Checkout API source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Reject public package and reused version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GUARD_PHASE: before
      run: python3 -B .github/scripts/private-package.py
    - name: Checkout pinned frontend
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ github.repository_owner }}/rustdesk-api-web
        ref: ${{ env.FRONTEND_REF }}
        path: rustdesk-api-web
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Build locked frontend only in CI
      working-directory: rustdesk-api-web
      run: |-
        test -f package-lock.json
        npm ci --no-audit --no-fund
        npm run build
        git diff --exit-code -- package.json package-lock.json
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.23.10
        cache: true
    - name: Install musl compiler only in CI
      run: |-
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends musl-tools
    - name: Build static API with verified checksums
      env:
        GOOS: linux
        GOARCH: amd64
        CGO_ENABLED: '1'
        CC: musl-gcc
      run: |-
        test -f go.sum
        mkdir -p amd64/release/data amd64/release/runtime
        cp -a resources conf docs amd64/release/
        mkdir -p amd64/release/resources/admin
        cp -a rustdesk-api-web/dist/. amd64/release/resources/admin/
        printf '%s\n' "$APP_VERSION" > amd64/release/resources/version
        go build -mod=readonly -trimpath -ldflags '-s -w -linkmode external -extldflags -static' -o amd64/release/apimain ./cmd/apimain.go
        git diff --exit-code -- go.mod go.sum
        if readelf -l amd64/release/apimain | grep -q INTERP; then exit 1; fi
        # 仅复制源码资源；数据库和密钥禁止进入构建上下文。
        test -z "$(find amd64/release/data -type f -print -quit)"
        test -z "$(find amd64 -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.sqlite3*' -o -name 'id_ed25519*' \) -print -quit)"
    - name: Build API image from narrow context
      run: |-
        image="localhost/rustdesk-api:release"
        docker build --platform linux/amd64 --build-arg BUILDARCH=. \
          --build-arg "API_RUNTIME_IMAGE=$API_RUNTIME_IMAGE" --tag "$image" --file Dockerfile amd64
        printf 'API_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
    - name: Checkout pinned server
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ github.repository_owner }}/rustdesk-server
        ref: ${{ env.SERVER_REF }}
        path: server
        submodules: recursive
        persist-credentials: false
    - name: Build locked static server binaries only in CI
      working-directory: server
      env:
        MUSL_BUILDER: ghcr.io/rust-cross/rust-musl-cross@sha256:fb7229c2a7dd84957e3a46f8bec7d01c4ec7c295ad159606623093a0a9286253
      run: |-
        test "$(git rev-parse HEAD)" = "$SERVER_REF"
        docker run --rm --platform linux/amd64 -e CARGO_BUILD_JOBS=2 \
          -v "$PWD:/home/rust/src" -w /home/rust/src "$MUSL_BUILDER" \
          cargo build --release --locked --bins --target=x86_64-unknown-linux-musl
        for binary in hbbs hbbr rustdesk-utils; do
          path="target/x86_64-unknown-linux-musl/release/$binary"
          if readelf -l "$path" | grep -q INTERP; then exit 1; fi
          install -m 0755 "$path" "docker/rootfs/usr/bin/$binary"
        done
        git diff --exit-code -- Cargo.lock
    - name: Build combined private release image
      run: |-
        cp .github/scripts/s6-healthcheck.sh server/docker/rootfs/usr/bin/healthcheck.sh
        chmod 0755 server/docker/rootfs/usr/bin/healthcheck.sh
        image="$REGISTRY_IMAGE:$RELEASE_VERSION"
        docker build --platform linux/amd64 --build-arg "API_IMAGE=$API_IMAGE" --build-arg S6_ARCH=x86_64 \
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --label "org.opencontainers.image.version=$RELEASE_VERSION" \
          --label "io.rustdesk.server.revision=$SERVER_REF" \
          --label "io.rustdesk.frontend.revision=$FRONTEND_REF" \
          --label "io.rustdesk.api.base-version=2.6.29" \
          --tag "$image" --file server/docker/Dockerfile server/docker
        docker run --rm --network none --entrypoint /bin/sh "$image" -c \
          'test -z "$(find /data /app/data -type f -print -quit)"'
    - name: Check isolated startup before publication
      run: |-
        image="$REGISTRY_IMAGE:$RELEASE_VERSION"
        docker run -d --name rustdesk-release-smoke --network none --memory 384m \
          --tmpfs /data:rw,mode=700 --tmpfs /app/data:rw,mode=700 \
          -e RELAY=127.0.0.1:21117 -e ENCRYPTED_ONLY=1 "$image"
        ready=false
        for attempt in $(seq 1 40); do
          if docker exec rustdesk-release-smoke /usr/bin/healthcheck.sh >/dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$ready" = true
        version="$(docker exec rustdesk-release-smoke wget -q -T 3 -O - http://127.0.0.1:21114/api/version)"
        [[ "$version" == *"$APP_VERSION"* ]]
        docker rm -f rustdesk-release-smoke
    - name: Authenticate private GHCR publishing
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push fixed version and read registry digest
      run: |-
        image="$REGISTRY_IMAGE:$RELEASE_VERSION"
        docker push "$image"
        # Docker 已有构建层，拉取核对仓库 manifest，不删除缓存或强制冷拉取。
        docker pull "$image"
        digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
        [[ "$digest" == "$REGISTRY_IMAGE@sha256:"* ]]
        printf 'IMMUTABLE_IMAGE=%s\n' "$digest" >> "$GITHUB_ENV"
        printf 'IMAGE_DIGEST=%s\n' "$digest" | sed 's/IMAGE_DIGEST=.*@/IMAGE_DIGEST=/' >> "$GITHUB_ENV"
    - name: Confirm published package remains private
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GUARD_PHASE: after
      run: python3 -B .github/scripts/private-package.py
    - name: Verify anonymous access is denied
      run: |-
        auth_dir="$(mktemp -d)"
        if docker --config "$auth_dir" manifest inspect "$IMMUTABLE_IMAGE" >/dev/null 2>anon-error.txt; then
          echo '::error::Anonymous access unexpectedly allowed'
          exit 1
        fi
        grep -Eqi 'denied|unauthorized|authentication required|forbidden' anon-error.txt
        echo 'PASS anonymous registry access denied'
    - name: Verify authenticated Podman pull and startup
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        command -v podman
        auth="$RUNNER_TEMP/rustdesk-podman-auth.json"
        printf '%s' "$GHCR_TOKEN" | podman login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
        podman pull --authfile "$auth" "$IMMUTABLE_IMAGE"
        # Podman 存储仅在 CI 写入；复用预装工具，不在用户电脑安装。
        podman run -d --name rustdesk-podman-smoke --network none --memory 384m \
          --tmpfs /data:rw,mode=700 --tmpfs /app/data:rw,mode=700 \
          -e RELAY=127.0.0.1:21117 -e ENCRYPTED_ONLY=1 "$IMMUTABLE_IMAGE"
        ready=false
        for attempt in $(seq 1 40); do
          if podman exec rustdesk-podman-smoke /usr/bin/healthcheck.sh >/dev/null 2>&1; then
            ready=true
            break
          fi
          sleep 2
        done
        test "$ready" = true
        version="$(podman exec rustdesk-podman-smoke wget -q -T 3 -O - http://127.0.0.1:21114/api/version)"
        [[ "$version" == *"$APP_VERSION"* ]]
        podman rm -f rustdesk-podman-smoke
    - name: Record private release result
      run: |-
        {
          printf '### Private RustDesk S6 release\n\n'
          printf -- '- Image: %s\n' "$IMMUTABLE_IMAGE"
          printf -- '- Version: %s\n' "$RELEASE_VERSION"
          printf -- '- Platform: linux/amd64\n'
          printf -- '- Visibility: private\n'
          printf -- '- Docker and Podman authenticated startup: passed\n'
          printf -- '- Anonymous registry access: denied\n'
          printf -- '- Source and deployment files: %s\n' "$GITHUB_SHA"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Clean disposable CI containers
      if: always()
      run: |-
        docker rm -f rustdesk-release-smoke >/dev/null 2>&1 || true
        podman rm -f rustdesk-podman-smoke >/dev/null 2>&1 || true
